[project]
name = "team3-pm-api"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S608", "E501"]
# B008: Depends() in defaults is the FastAPI pattern.
# S608: SQL strings only contain fixed table names; user values are bound parameters.
