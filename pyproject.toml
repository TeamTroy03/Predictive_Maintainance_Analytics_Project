[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-analytics"
version = "0.1.0"
description = "Team 3 capstone: predictive maintenance analytics platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.13.5",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "data*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
